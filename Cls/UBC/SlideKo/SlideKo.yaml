General:
    comment:
    seed: 2024
    fp16: False
    amp_level: O2
    precision: 32
    multi_gpu_mode: dp
    gpus: [0]
    epochs: &epoch 1000
    grad_acc: 4
    frozen_bn: False
    patience: 40
    server: test # train or test
    log_path: logs/

Data:
    dataset_name: ClsVlmData
    data_high_dir: /mnt/HDD_12T/wsi_features/AlignFeats/UBC-OCEAN/feats-m20-s448-conch_v1_5/pt_files/
    data_low_dir: /mnt/HDD_12T/wsi_features/AlignFeats/UBC-OCEAN/feats-m20-s448-conch_v1_5/pt_files/
    label_dir: splits/4foldcls/ucb_ocean/
    concept_dir: resources/concept_pools/UBC-OCEAN/titan_features/UBC-OCEAN_titan_concept_desc_pathology_prompts_embeddings.pt
    sampling_seed: 42
    n_shot: 16

    train_dataloader:
        batch_size: 1
        num_workers: 8

    test_dataloader:
        batch_size: 1
        num_workers: 8

Model:
    name: SlideKo
    text_prompt_path: resources/text_prompt/Claude/UBC_text_prompt.csv
    titan_model_path: /home/junjianli/.cache/huggingface/hub/models--MahmoodLab--TITAN/snapshots/b2fb4f475256eb67c6e9ccbf2d6c9c3f25f20791
    local_files_only: True
